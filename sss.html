<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رسالة ليكي 🌸</title>

<style>
body{
    margin:0;
    padding:0;
    background: linear-gradient(135deg,#ffb6c1,#ffc0cb,#ffe4e1);
    font-family: Arial, sans-serif;
    text-align:center;
    color:white;
}

/* صورة خلفية رومانسية */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:url("romantic.jpg");
    background-size:cover;
    background-position:center;
    opacity:0.35;
    z-index:-1;
}

h1{
    margin-top:70px;
    font-size:46px;
}

p{
    font-size:22px;
    margin:20px;
    line-height:1.8;
}

.heart{
    width:300px;
    height:300px;
    margin:40px auto;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 35px rgba(255,0,120,0.7);
    animation: beat 1.4s infinite;
}

.heart img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@keyframes beat{
    0%{transform:scale(1);}
    50%{transform:scale(1.06);}
    100%{transform:scale(1);}
}

audio{
    margin-top:20px;
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4e50;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff4e50;
    color:white;
}
</style>
</head>

<body>

<h1>رسالة صغيرة ليكي 🌷</h1>

<p>
يمكن إحنا صحاب…  
بس وجودك في حياتي بيفرق معايا بطريقة جميلة 💫 <br><br>

ضحكتك بتخلّي اليوم أحلى  
وكلامك دايماً بيريّح قلبي شوية 🌸 <br><br>

</p>

<div class="heart">
    <img src="Love.jpeg" alt="صورة جميلة">
</div>



<br><br>

<button onclick="showMessage()">اضغطي هنا 💌</button>

<script>
function showMessage(){
    alert("وجودك في حياتي حاجة جميلة بجد 🌸");
}
</script>

</body>
</html>
